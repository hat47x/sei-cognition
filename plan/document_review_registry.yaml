schema: soza.document-review-registry/v1
updated: 2026-09-02

purpose: >-
  ISSUE-000015で確立した自然な日本語監査について、current branch上の開発文書の
  対象範囲と監査状態を管理する台帳。意味上の正本は各文書自身であり、この台帳は
  監査管理のための補助資料とする。

status_vocabulary:
  revised: 内容・構造を確認した後、自然な日本語を最重要視して全文を再ドラフトし、最終意味監査まで完了した。
  reviewed-no-change: 全文を確認し、文書の役割・意味・可読性を踏まえて現状の本文を保つと判断した。
  excluded-historical: 原文保存または固定Evidenceとしての性質から、改稿対象外とした。
  pending: current開発文書だが、今回の全件監査がまだ完了していない。

