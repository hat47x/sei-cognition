pending: []

exclusions:
  - scope: fixtures/**/*.json
    status: excluded-historical
    reason: 固定入力・Expected Evidenceであり、自然な日本語への改稿対象ではない。
  - scope: contracts/schemas/**/*.json
    status: excluded-historical
    reason: machine-readable schemaであり、本文日本語監査の対象ではない。
  - scope: runtime/**/*.go
    status: excluded-historical
    reason: source codeであり、本台帳が対象とする開発文書本文ではない。code commentは実装変更時の通常reviewで扱う。
  - scope: evaluation/**/*.py
    status: excluded-historical
    reason: 評価実行コードであり、本台帳が対象とする自然言語文書本文ではない。code commentは実装変更時の通常reviewで扱う。
  - scope: evaluation/**/*.json
    status: excluded-historical
    reason: 固定評価入力・Expected Evidenceであり、自然な日本語への改稿対象ではない。
  - scope: tools/*.{py,go,txt}
    status: excluded-historical
    reason: 実行コード・依存定義であり、本台帳が対象とする自然言語文書本文ではない。
  - scope: .github/workflows/*.yml
    status: excluded-historical
    reason: CI定義であり、本台帳が対象とする自然言語文書ではない。

closure_rule: >-
  current Markdown開発文書にpendingが発生した場合は、ISSUE-000015で確立した監査手順を通常の文書作成・更新工程として適用する。
  新規文書は作業単位の中でrevisedまたはreviewed-no-changeへ到達させる。原文自体がEvidenceである資料は、
  意味を損なう改稿をせずexcluded-historicalまたはreviewed-no-changeとして理由を残す。