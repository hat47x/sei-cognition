exclusions:
  - scope: fixtures/**/*.json
    status: excluded-historical
    reason: 固定入力・Expected Evidenceであり、自然な日本語への改稿対象ではない。
  - scope: contracts/schemas/**/*.json
    status: excluded-historical
    reason: machine-readable schemaであり、本文日本語監査の対象ではない。
  - scope: runtime/**/*.go
    status: excluded-historical
    reason: source codeであり、本台帳が対象とする開発文書本文ではない。code commentは実装変更時の通常reviewで扱う。
  - scope: tools/*.{py,go,txt}
    status: excluded-historical
    reason: 実行コード・依存定義であり、本台帳が対象とする開発文書本文ではない。
  - scope: .github/workflows/*.yml
    status: excluded-historical
    reason: CI定義であり、本台帳が対象とする自然言語文書ではない。

closure_rule: >-
  pendingが残る限りISSUE-000015をResolvedにしない。新しいcurrent Markdown開発文書を追加した場合は、
  作業単位の中でrevisedまたはreviewed-no-changeへ到達できるなら直接reviewedへ登録し、
  既存文書として後続監査が必要な場合だけpendingへ追加する。原文自体がEvidenceである資料は、
  改稿せずexcluded-historicalとして理由を残す。
