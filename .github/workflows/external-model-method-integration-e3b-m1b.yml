name: External Model-backed Method E3b M1b

on:
  pull_request:
    paths:
      - "runtime/integration/e3b_m1b_ollama_adapter.py"
      - "runtime/go/livemethodintegration/**"
      - "runtime/MODEL_BACKED_METHOD_EVIDENCE_*.md"
      - "product/README.md"
      - "product/definition/SOZA_REALIZATION_PROVIDER_EXCHANGE.md"
      - "product/roadmap/SOZA_PRODUCT_MILESTONES.md"
      - "plan/UPSTREAM_PRODUCT_DEVELOPMENT_PLAN.md"
      - "plan/issue/ISSUE-000066-*.md"
      - "plan/issue/ISSUE-000067-*.md"
      - "plan/registry.yaml"
      - "plan/document_review_registry.yaml"
      - ".github/workflows/external-model-method-integration-e3b-m1b.yml"
  push:
    branches:
      - develop/v0.2.0
    paths:
      - "runtime/integration/e3b_m1b_ollama_adapter.py"
      - "runtime/go/livemethodintegration/**"
      - "runtime/MODEL_BACKED_METHOD_EVIDENCE_*.md"
      - "product/README.md"
      - "product/definition/SOZA_REALIZATION_PROVIDER_EXCHANGE.md"
      - "product/roadmap/SOZA_PRODUCT_MILESTONES.md"
      - "plan/UPSTREAM_PRODUCT_DEVELOPMENT_PLAN.md"
      - "plan/issue/ISSUE-000066-*.md"
      - "plan/issue/ISSUE-000067-*.md"
      - "plan/registry.yaml"
      - "plan/document_review_registry.yaml"
      - ".github/workflows/external-model-method-integration-e3b-m1b.yml"

permissions:
  contents: read

jobs:
  actual-model-backed-kj-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOZA
        uses: actions/checkout@v4

      - name: Checkout pinned KJ Atlas
        uses: actions/checkout@v4
        with:
          repository: hat47x/kj-atlas
          ref: 4f28c13abe4176503c6fed863383a2d1db2299e9
          path: _external/kj-atlas
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: runtime/go/go.mod

      - name: Install digest-pinned Ollama runtime
        shell: bash
        env:
          OLLAMA_VERSION: "0.32.14"
          OLLAMA_INSTALLER_SHA256: "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" \
            --output /tmp/ollama-install.sh
          printf '%s  %s\n' "${OLLAMA_INSTALLER_SHA256}" /tmp/ollama-install.sh \
            | sha256sum --check --strict
          OLLAMA_VERSION="${OLLAMA_VERSION}" sh /tmp/ollama-install.sh
          ollama --version 2>&1 | tee /tmp/ollama-version.txt
          grep -F "${OLLAMA_VERSION}" /tmp/ollama-version.txt

      - name: Start Ollama and acquire the pinned model identity
        shell: bash
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          set -euo pipefail
          ollama serve >/tmp/ollama.log 2>&1 &
          echo $! >/tmp/ollama.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              echo "Ollama did not become ready" >&2
              cat /tmp/ollama.log >&2 || true
              exit 1
            fi
            sleep 0.5
          done

          ollama pull qwen2.5:0.5b
          ollama list | tee /tmp/ollama-list.txt
          grep -E '^qwen2\.5:0\.5b[[:space:]]+a8b0c5157701([[:space:]]|$)' /tmp/ollama-list.txt

      - name: Install pinned KJ Atlas backend
        run: python -m pip install -e "_external/kj-atlas/03_Implement/backend"

      - name: Prepare KJ Atlas SQLite schema
        working-directory: _external/kj-atlas/03_Implement/backend
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:////tmp/kj-atlas-e3b-m1b.db
        run: alembic upgrade head

      - name: Start actual model adapter and KJ Atlas backend
        shell: bash
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:////tmp/kj-atlas-e3b-m1b.db
          KJ_ATLAS_RUNTIME_PROFILE: local-dev
          KJ_ATLAS_LLM_PROVIDER: local
          KJ_ATLAS_LOCAL_LLM_BASE_URL: http://127.0.0.1:8001
          KJ_ATLAS_LOCAL_LLM_MODEL: qwen2.5:0.5b
          KJ_ATLAS_LLM_FALLBACK_TO_NONE: "false"
          SOZA_M1B_MODEL: qwen2.5:0.5b
          SOZA_M1B_MODEL_EVIDENCE: /tmp/soza-e3b-m1b-model-call.json
        run: |
          set -euo pipefail
          python runtime/integration/e3b_m1b_ollama_adapter.py \
            --host 127.0.0.1 --port 8001 >/tmp/soza-m1b-adapter.log 2>&1 &
          echo $! >/tmp/soza-m1b-adapter.pid

          PYTHONPATH=_external/kj-atlas/03_Implement/backend/src \
            uvicorn kj_atlas_api.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/kj-atlas-m1b-backend.log 2>&1 &
          echo $! >/tmp/kj-atlas-m1b-backend.pid

          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:8001/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          echo "E3b-M1b processes did not become ready" >&2
          cat /tmp/soza-m1b-adapter.log >&2 || true
          cat /tmp/kj-atlas-m1b-backend.log >&2 || true
          cat /tmp/ollama.log >&2 || true
          exit 1

      - name: Execute KJ Atlas grouping through the actual model
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/kj-atlas-m1b-request.json <<'JSON'
          {
            "cards": [
              {"id":"c-remote-time","text":"在宅勤務では通勤に使う時間を減らせる","textReviewed":true},
              {"id":"c-remote-load","text":"在宅勤務では移動による負担を減らせる","textReviewed":true},
              {"id":"c-held","text":"人事評価制度の見直しはまだ着手していない","textReviewed":true}
            ],
            "doc": {
              "version": 1,
              "id": "soza-e3b-m1b",
              "createdAt": "2026-09-02T00:00:00Z",
              "updatedAt": "2026-09-02T00:00:00Z",
              "transform": {"panX":0,"panY":0,"zoom":1},
              "cards": [
                {"id":"c-remote-time","text":"在宅勤務では通勤に使う時間を減らせる","x":0,"y":0,"textReviewed":true},
                {"id":"c-remote-load","text":"在宅勤務では移動による負担を減らせる","x":40,"y":0,"textReviewed":true},
                {"id":"c-held","text":"人事評価制度の見直しはまだ着手していない","x":80,"y":0,"textReviewed":true,"holdState":"held"}
              ],
              "edges": [],
              "islands": [],
              "evidenceLinks": []
            }
          }
          JSON

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @/tmp/kj-atlas-m1b-request.json \
            http://127.0.0.1:8000/ai/suggest-card-groups \
            >/tmp/kj-atlas-m1b-result.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/kj-atlas-m1b-result.json').read_text(encoding='utf-8'))
          evidence = json.loads(Path('/tmp/soza-e3b-m1b-model-call.json').read_text(encoding='utf-8'))

          assert isinstance(result.get('groups'), list) and result['groups'], result
          assert result.get('excludedCardIds') == ['c-held'], result
          assert result.get('truncated') is False, result
          assert evidence.get('model') == 'qwen2.5:0.5b', evidence
          assert evidence.get('task') == 'suggest_card_groups', evidence
          assert evidence.get('ollama_done') is True, evidence
          assert isinstance(evidence.get('prompt_eval_count'), int) and evidence['prompt_eval_count'] > 0, evidence
          assert isinstance(evidence.get('eval_count'), int) and evidence['eval_count'] > 0, evidence

          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY

      - name: Reuse SOZA Method mapping boundary tests
        working-directory: runtime/go
        run: go test ./livemethodintegration -count=1

      - name: Map actual model-backed Method result into SOZA semantic records
        working-directory: runtime/go
        env:
          SOZA_E3B_METHOD_LIVE: "1"
          SOZA_E3B_METHOD_RESULT: /tmp/kj-atlas-m1b-result.json
          SOZA_E3B_METHOD_SOURCE_COMMIT: 4f28c13abe4176503c6fed863383a2d1db2299e9
          SOZA_E3B_METHOD_REALIZATION_ID: MR-KJ-ATLAS-M1B
          SOZA_E3B_METHOD_EXECUTION_PROFILE: ollama-model-backed
          SOZA_E3B_METHOD_RUNTIME: ollama
          SOZA_E3B_METHOD_RUNTIME_VERSION: "0.32.14"
          SOZA_E3B_METHOD_MODEL: qwen2.5:0.5b
          SOZA_E3B_METHOD_MODEL_ID: a8b0c5157701
        run: go test ./livemethodintegration -run '^TestLiveKJAtlasMethodExecution$' -count=1 -v

      - name: Show process evidence on failure
        if: failure()
        run: |
          cat /tmp/kj-atlas-m1b-result.json || true
          cat /tmp/soza-e3b-m1b-model-call.json || true
          cat /tmp/ollama-list.txt || true
          cat /tmp/ollama-version.txt || true
          cat /tmp/soza-m1b-adapter.log || true
          cat /tmp/kj-atlas-m1b-backend.log || true
          cat /tmp/ollama.log || true

      - name: Stop external processes
        if: always()
        run: |
          if test -f /tmp/kj-atlas-m1b-backend.pid; then kill "$(cat /tmp/kj-atlas-m1b-backend.pid)" 2>/dev/null || true; fi
          if test -f /tmp/soza-m1b-adapter.pid; then kill "$(cat /tmp/soza-m1b-adapter.pid)" 2>/dev/null || true; fi
          if test -f /tmp/ollama.pid; then kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true; fi
