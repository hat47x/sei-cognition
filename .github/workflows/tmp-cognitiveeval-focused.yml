name: temporary cognitiveeval focused test

on:
  pull_request:
    paths:
      - 'evaluation/sparse-associative-cognition/prototype-go/**'
      - '.github/workflows/tmp-cognitiveeval-focused.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation/sparse-associative-cognition/prototype-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: evaluation/sparse-associative-cognition/prototype-go/go.mod
          cache-dependency-path: evaluation/sparse-associative-cognition/prototype-go/go.mod
      - run: go test ./hybridreasoning ./cognitiveeval
