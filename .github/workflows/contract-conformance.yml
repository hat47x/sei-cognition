name: Contract Conformance

on:
  push:
    branches:
      - "develop/**"
    paths:
      - "contracts/**"
      - "fixtures/contracts/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - ".github/workflows/contract-conformance.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "fixtures/contracts/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - ".github/workflows/contract-conformance.yml"

permissions:
  contents: read

jobs:
  contract-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check -r tools/contract-check-requirements.txt

      - name: Run contract conformance
        run: python tools/check_contract_conformance.py
