name: Plan integrity

on:
  pull_request:
    paths:
      - "plan/**"
      - "**/*.md"
      - ".github/workflows/plan-integrity.yml"

permissions:
  contents: write

jobs:
  repair-pr59-registries:
    if: ${{ github.event.pull_request.number == 59 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize current planning registries
        run: python3 plan/scripts/repair_pr59_registries.py

      - name: Verify planning registries
        run: |
          python3 plan/scripts/check_plan_registry.py
          python3 plan/scripts/check_document_review_registry.py

      - name: Commit synchronized registries
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plan/registry.yaml plan/document_review_registry.yaml
          if git diff --cached --quiet; then
            echo "registries already synchronized"
            exit 0
          fi
          git commit -m "ISSUE-000069を最新Planning基線へ同期する"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
