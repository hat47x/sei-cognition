name: Plan integrity

on:
  pull_request:
    paths:
      - "plan/**"
      - "**/*.md"
      - ".github/workflows/plan-integrity.yml"
  push:
    branches:
      - "develop/**"
    paths:
      - "plan/**"
      - "**/*.md"
      - ".github/workflows/plan-integrity.yml"

permissions:
  contents: read

jobs:
  plan-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile planning tools
        run: >-
          python3 -m py_compile
          plan/scripts/check_plan_registry.py
          plan/scripts/check_document_review_registry.py
          plan/scripts/test_check_document_review_registry.py
          plan/scripts/next_plan_id.py

      - name: Test document review registry checker
        run: python3 -m unittest plan/scripts/test_check_document_review_registry.py

      - name: Check ADR / Issue / registry integrity
        run: python3 plan/scripts/check_plan_registry.py

      - name: Check document review registry coverage
        run: python3 plan/scripts/check_document_review_registry.py

      - name: Show next candidate IDs
        run: python3 plan/scripts/next_plan_id.py
