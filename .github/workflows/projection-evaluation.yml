name: V6 V7 Projection Evaluation

on:
  push:
    branches:
      - "develop/**"
    paths:
      - "evaluation/v6-v7/**"
      - "fixtures/contracts/v1alpha1/evaluation/**"
      - "contracts/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - "product/value/**"
      - "requirements/**"
      - "plan/adr/ADR-0005-progressive-semantic-explicitness.md"
      - "plan/adr/ADR-0018-product-value-authority-and-evaluation-boundary.md"
      - "plan/adr/ADR-0020-requirements-traceability-and-evidence-boundary.md"
      - "plan/adr/ADR-0021-architecture-contract-authority-and-versioning.md"
      - "plan/issue/ISSUE-000039-validate-human-ai-readability-progressive-explicitness.md"
      - ".github/workflows/projection-evaluation.yml"
  pull_request:
    paths:
      - "evaluation/v6-v7/**"
      - "fixtures/contracts/v1alpha1/evaluation/**"
      - "contracts/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - "product/value/**"
      - "requirements/**"
      - "plan/adr/ADR-0005-progressive-semantic-explicitness.md"
      - "plan/adr/ADR-0018-product-value-authority-and-evaluation-boundary.md"
      - "plan/adr/ADR-0020-requirements-traceability-and-evidence-boundary.md"
      - "plan/adr/ADR-0021-architecture-contract-authority-and-versioning.md"
      - "plan/issue/ISSUE-000039-validate-human-ai-readability-progressive-explicitness.md"
      - ".github/workflows/projection-evaluation.yml"

permissions:
  contents: read

jobs:
  projection-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current Contract checker dependencies
        run: python -m pip install --disable-pip-version-check -r tools/contract-check-requirements.txt

      - name: Recheck current Contract baseline
        run: python tools/check_contract_conformance.py

      - name: Evaluate V6 / V7 Projections
        run: python evaluation/v6-v7/check_projection_evaluation.py
