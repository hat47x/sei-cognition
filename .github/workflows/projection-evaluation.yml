name: Projection Evaluation

on:
  push:
    branches:
      - "develop/**"
    paths:
      - "requirements/evidence/**"
      - "fixtures/evaluation/**"
      - "tools/check_projection_evaluation.py"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - "contracts/schemas/v1alpha1/**"
      - ".github/workflows/projection-evaluation.yml"
  pull_request:
    paths:
      - "requirements/evidence/**"
      - "fixtures/evaluation/**"
      - "tools/check_projection_evaluation.py"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - "contracts/schemas/v1alpha1/**"
      - ".github/workflows/projection-evaluation.yml"

permissions:
  contents: read

jobs:
  projection-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Contract checker dependencies
        run: python -m pip install --disable-pip-version-check -r tools/contract-check-requirements.txt

      - name: Evaluate Human / AI Readability and Progressive Explicitness
        run: python tools/check_projection_evaluation.py
