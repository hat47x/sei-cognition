name: Release Candidate Gate

on:
  push:
    branches:
      - "develop/v0.1.0"
      - "develop/v0.2.0"
    tags:
      - "v0.1.0"
      - "v0.2.0"
    paths:
      - "release/**"
      - "tools/check_release_candidate.py"
      - "tools/prepare_v0_2_0_release.py"
      - ".github/workflows/release-candidate.yml"
  pull_request:
    branches:
      - "develop/v0.1.0"
      - "develop/v0.2.0"
    paths:
      - "README.md"
      - "product/**"
      - "requirements/**"
      - "architecture/**"
      - "contracts/**"
      - "evaluation/**"
      - "fixtures/**"
      - "plan/**"
      - "release/**"
      - "runtime/**"
      - "tools/**"
      - ".github/workflows/release-candidate.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate policy version"
        required: true
        default: "0.2.0"
        type: choice
        options:
          - "0.1.0"
          - "0.2.0"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      publication_requested: ${{ steps.publication_state.outputs.requested }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version-specific candidate policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            case "${GITHUB_BASE_REF}" in
              develop/v0.1.0) version="0.1.0" ;;
              develop/v0.2.0) version="0.2.0" ;;
              *) echo "unsupported release candidate base: ${GITHUB_BASE_REF}" >&2; exit 1 ;;
            esac
          else
            case "${GITHUB_REF_NAME}" in
              develop/v0.1.0|v0.1.0) version="0.1.0" ;;
              develop/v0.2.0|v0.2.0) version="0.2.0" ;;
              *) echo "unsupported release candidate ref: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
          fi
          config="release/v${version}/release-candidate.json"
          report="generated/release-candidate/v${version}-report.json"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "report=${report}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release publication lifecycle
        id: publication_state
        shell: bash
        run: |
          set -euo pipefail
          requested="false"
          if [[ "${{ steps.policy.outputs.version }}" == "0.2.0" ]]; then
            requested="$(python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("release/v0.2.0/release-request.json").read_text(encoding="utf-8"))
          expected = {
              "schema": "soza.release-request/v1",
              "version": "0.2.0",
              "tag": "v0.2.0",
              "repository": "hat47x/soza",
              "target_branch": "develop/v0.2.0",
              "release_scope": "local-reference-product-baseline",
              "artifact_target": "linux-amd64",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(
                      f"release request mismatch: {key}={request.get(key)!r}, expected {value!r}"
                  )

          publish = request.get("publish")
          if not isinstance(publish, bool):
              raise SystemExit("release request.publish must be a boolean")
          state = request.get("publication_state")
          expected_state = "requested" if publish else "completed"
          if state != expected_state:
              raise SystemExit(
                  f"release request publication lifecycle mismatch: state={state!r}, "
                  f"expected {expected_state!r} for publish={publish!r}"
              )
          print("true" if publish else "false")
          PY
          )"
          fi
          echo "requested=${requested}" >> "$GITHUB_OUTPUT"
          echo "release publication requested: ${requested}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: runtime/go/go.mod

      - name: Install checker dependencies
        run: python -m pip install --disable-pip-version-check -r tools/contract-check-requirements.txt

      - name: Compile release and registry tools
        run: |
          python3 -m py_compile \
            plan/scripts/check_plan_registry.py \
            plan/scripts/check_document_review_registry.py \
            plan/scripts/check_requirements_registry.py \
            plan/scripts/test_check_requirements_registry.py \
            tools/check_contract_conformance.py \
            tools/check_representation_profiles.py \
            tools/check_release_candidate.py \
            tools/prepare_v0_2_0_release.py \
            evaluation/v6-v7/check_projection_evaluation.py

      - name: Gate 1 - Plan integrity
        run: |
          python3 plan/scripts/check_plan_registry.py
          python3 plan/scripts/check_document_review_registry.py

      - name: Gate 2 - Requirements registry
        run: |
          python3 plan/scripts/test_check_requirements_registry.py
          python3 plan/scripts/check_requirements_registry.py

      - name: Gate 3 - Contract conformance
        run: python3 tools/check_contract_conformance.py

      - name: Gate 4 - Representation Profile fixtures
        run: python3 tools/check_representation_profiles.py

      - name: Gate 5 - commit-pinned RFC 8785 JCS probe
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          cp tools/jcs_probe.go "$probe_dir/main.go"
          cd "$probe_dir"
          go mod init soza.local/jcsprobe
          go get github.com/gowebpki/jcs@1a4242a66e1a8e03d7458324d0bc95c327527cbb
          go run . "$GITHUB_WORKSPACE/fixtures/representation-profiles/jcs-v1alpha1.json"

      - name: Gate 6 - Semantic Runtime conformance
        working-directory: runtime/go
        run: go test ./...

      - name: Gate 7 - V6 V7 Projection evaluation
        run: python3 evaluation/v6-v7/check_projection_evaluation.py

      - name: Gate 8 - Local Reference Package
        if: steps.policy.outputs.version == '0.2.0'
        env:
          ARTIFACT_VERSION: "0.2.0-reference"
          ARTIFACT_TARGET: "linux-amd64"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/soza-local-reference-linux-amd64 dist/repro
          LDFLAGS="-s -w -X main.buildVersion=${ARTIFACT_VERSION} -X main.buildCommit=${GITHUB_SHA} -X main.buildTarget=${ARTIFACT_TARGET}"
          (
            cd runtime/go
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="$LDFLAGS" -o ../../dist/soza-local-reference-linux-amd64/soza-local-reference ./cmd/soza-package-probe
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="$LDFLAGS" -o ../../dist/repro/soza-local-reference ./cmd/soza-package-probe
          )
          cmp dist/soza-local-reference-linux-amd64/soza-local-reference dist/repro/soza-local-reference
          cp runtime/package/reference/README.md dist/soza-local-reference-linux-amd64/README.md
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "artifact_format": "soza.local-reference/v1",
              "version": os.environ["ARTIFACT_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "target": os.environ["ARTIFACT_TARGET"],
          }
          Path("dist/soza-local-reference-linux-amd64/build-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          dist/soza-local-reference-linux-amd64/soza-local-reference version > dist/version.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads(Path("dist/version.json").read_text(encoding="utf-8"))
          expected = {
              "version": os.environ["ARTIFACT_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "target": os.environ["ARTIFACT_TARGET"],
          }
          if actual != expected:
              raise SystemExit(f"build identity mismatch: {actual!r} != {expected!r}")
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C dist/soza-local-reference-linux-amd64 -cf dist/soza-local-reference-linux-amd64.tar .
          gzip -n -9 dist/soza-local-reference-linux-amd64.tar
          sha256sum dist/soza-local-reference-linux-amd64.tar.gz > dist/soza-local-reference-linux-amd64.tar.gz.sha256
          mkdir -p dist/extracted dist/runtime-data
          tar -xzf dist/soza-local-reference-linux-amd64.tar.gz -C dist/extracted
          test "$(python3 -c 'import json; print(json.load(open("dist/extracted/build-metadata.json"))["commit"])')" = "$GITHUB_SHA"
          dist/extracted/soza-local-reference save \
            --data-root dist/runtime-data \
            --input fixtures/contracts/v1alpha1/boundary/partial-knowledge-interchange.json
          dist/extracted/soza-local-reference inspect --data-root dist/runtime-data > dist/inspect.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("dist/inspect.json").read_text(encoding="utf-8"))
          expected = {
              "bundle_id": "partial-knowledge-interchange",
              "record_count": 2,
              "validated_count": 2,
              "not_verified_count": 0,
          }
          if actual != expected:
              raise SystemExit(f"artifact resume mismatch: {actual!r} != {expected!r}")
          PY

      - name: Gate 9 - Release candidate policy and bound report
        run: |
          mkdir -p generated/release-candidate
          python3 tools/check_release_candidate.py \
            --config "${{ steps.policy.outputs.config }}" \
            --report "${{ steps.policy.outputs.report }}"

      - name: Upload v0.2.0 Local Reference Package
        if: steps.policy.outputs.version == '0.2.0'
        uses: actions/upload-artifact@v4
        with:
          name: soza-v0.2.0-local-reference-${{ github.sha }}
          path: |
            dist/soza-local-reference-linux-amd64.tar.gz
            dist/soza-local-reference-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: soza-v${{ steps.policy.outputs.version }}-release-candidate-${{ github.sha }}
          path: ${{ steps.policy.outputs.report }}
          if-no-files-found: error
          retention-days: 30

  prepare-v0-2-0-release:
    needs: release-candidate
    if: >-
      needs['release-candidate'].outputs.publication_requested == 'true' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'develop/v0.2.0') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/develop/v0.2.0'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Local Reference Package
        uses: actions/download-artifact@v4
        with:
          name: soza-v0.2.0-local-reference-${{ github.sha }}
          path: generated/release-preparation/package

      - name: Download candidate report
        uses: actions/download-artifact@v4
        with:
          name: soza-v0.2.0-release-candidate-${{ github.sha }}
          path: generated/release-preparation/report

      - name: Validate and prepare publication bundle
        run: |
          python3 tools/prepare_v0_2_0_release.py \
            --request release/v0.2.0/release-request.json \
            --candidate-report generated/release-preparation/report/v0.2.0-report.json \
            --package generated/release-preparation/package/soza-local-reference-linux-amd64.tar.gz \
            --checksum generated/release-preparation/package/soza-local-reference-linux-amd64.tar.gz.sha256 \
            --notes release/v0.2.0/RELEASE_NOTES.md \
            --output-dir generated/release-publication \
            --expected-commit "${GITHUB_SHA}" \
            --candidate-run-id "${GITHUB_RUN_ID}"

      - name: Upload prepared release publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: soza-v0.2.0-release-publication-${{ github.sha }}
          path: generated/release-publication
          if-no-files-found: error
          retention-days: 30

  publish-v0-2-0:
    needs:
      - release-candidate
      - prepare-v0-2-0-release
    if: >-
      needs['release-candidate'].outputs.publication_requested == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop/v0.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.2.0
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prepared publication bundle
        uses: actions/download-artifact@v4
        with:
          name: soza-v0.2.0-release-publication-${{ github.sha }}
          path: generated/release-publication

      - name: Validate publication request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path("release/v0.2.0/release-request.json").read_text(encoding="utf-8"))
          expected = {
              "schema": "soza.release-request/v1",
              "version": "0.2.0",
              "tag": "v0.2.0",
              "repository": "hat47x/soza",
              "target_branch": "develop/v0.2.0",
              "release_scope": "local-reference-product-baseline",
              "artifact_target": "linux-amd64",
              "publish": True,
              "publication_state": "requested",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"release request mismatch: {key}={request.get(key)!r}, expected {value!r}")
          print("release publication request: validated")
          PY

      - name: Publish tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${GITHUB_SHA}"
          release_name="$(python3 -c 'import json; print(json.load(open("release/v0.2.0/release-request.json"))["release_name"])')"

          set +e
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"
          tag_status=$?
          set -e

          if [[ ${tag_status} -eq 0 ]]; then
            if [[ "${tag_sha}" != "${source_sha}" ]]; then
              echo "existing ${TAG} points to ${tag_sha}, expected ${source_sha}" >&2
              exit 1
            fi
            echo "tag ${TAG} already points to expected commit ${source_sha}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${source_sha}" >/dev/null
            echo "created tag ${TAG} -> ${source_sha}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; publication is idempotently complete."
            exit 0
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${release_name}" \
            --notes-file release/v0.2.0/RELEASE_NOTES.md \
            generated/release-publication/soza-local-reference-linux-amd64.tar.gz \
            generated/release-publication/soza-local-reference-linux-amd64.tar.gz.sha256 \
            generated/release-publication/v0.2.0-candidate-report.json \
            generated/release-publication/release-metadata.json

          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,url,isDraft,isPrerelease
