name: Hosted Runner Allocation Probe

on:
  pull_request:
    paths:
      - ".github/workflows/runner-allocation-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocation:
    name: ${{ matrix.runner }} allocation
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    steps:
      - name: Confirm runner assignment
        shell: bash
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
