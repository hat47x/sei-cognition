name: Semantic Runtime Conformance

on:
  push:
    branches:
      - "develop/**"
    paths:
      - "runtime/**"
      - "contracts/**"
      - "fixtures/contracts/**"
      - "fixtures/providers/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - ".github/workflows/runtime-conformance.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "contracts/**"
      - "fixtures/contracts/**"
      - "fixtures/providers/**"
      - "tools/check_contract_conformance.py"
      - "tools/contract-check-requirements.txt"
      - ".github/workflows/runtime-conformance.yml"

permissions:
  contents: read

jobs:
  runtime-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Contract checker dependencies
        run: python -m pip install --disable-pip-version-check -r tools/contract-check-requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: runtime/go/go.mod

      - name: Recheck current Contract fixtures
        run: python tools/check_contract_conformance.py

      - name: Test semantic runtime and Provider adapters against current semantics
        working-directory: runtime/go
        run: go test ./...
