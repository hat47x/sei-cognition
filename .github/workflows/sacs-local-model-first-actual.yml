name: SACS first actual local model

on:
  workflow_dispatch:
  push:
    branches:
      - topic/sacs-hybrid-call-avoidance
    paths:
      - .github/workflows/sacs-local-model-first-actual.yml

permissions:
  contents: read

concurrency:
  group: sacs-local-model-first-actual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first-actual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID_PREFIX: gha-qwen35-08-${{ github.run_id }}-${{ github.run_attempt }}
      THREADS: "4"
      HEALTH_WAIT_SECONDS: "180"
      MODEL_SHA256: 57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/sei-local-model-first-actual"
          GO_TOOLCHAIN_WORK_DIR="$RUNNER_TEMP/sei-go-toolchain"
          export WORK_DIR GO_TOOLCHAIN_WORK_DIR
          {
            echo "WORK_DIR=$WORK_DIR"
            echo "GO_TOOLCHAIN_WORK_DIR=$GO_TOOLCHAIN_WORK_DIR"
          } >> "$GITHUB_ENV"
          mkdir -p "$WORK_DIR"
          {
            echo "github_sha=$GITHUB_SHA"
            echo "github_ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "uname=$(uname -a)"
            echo "initial_go=$(go version 2>&1 || true)"
            echo "disk_before:"
            df -h .
            echo "memory_before:"
            free -h || true
          } | tee "$WORK_DIR/runner-summary.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run canonical Go 1.25.14 bootstrap and sub-1B matrix
        id: actual
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash evaluation/local-model-probe/bootstrap_go125_first_actual.sh
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "actual_exit_code=$rc"
            echo "disk_after_actual:"
            df -h .
            echo "memory_after_actual:"
            free -h || true
          } | tee -a "$WORK_DIR/runner-summary.txt"
          exit 0

      - name: Run exact Go 1.25 prototype module regression
        id: regression
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          exact_go="$GO_TOOLCHAIN_WORK_DIR/go1.25.14-linux-amd64/go/bin/go"
          if [[ -x "$exact_go" ]]; then
            export PATH="$(dirname "$exact_go"):$PATH"
          fi
          observed="$(GOTOOLCHAIN=local go env GOVERSION 2>/dev/null || true)"
          if [[ "$observed" != "go1.25.14" ]]; then
            echo "exact Go 1.25.14 unavailable after bootstrap; observed=$observed" | tee -a "$WORK_DIR/runner-summary.txt"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GOTOOLCHAIN=local go version | tee -a "$WORK_DIR/runner-summary.txt"
          set +e
          (
            cd evaluation/sparse-associative-cognition/prototype-go
            GOTOOLCHAIN=local go test ./... -count=1
          ) 2>&1 | tee "$WORK_DIR/prototype-go125-test.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "prototype_go125_regression_exit_code=$rc" | tee -a "$WORK_DIR/runner-summary.txt"
          exit 0

      - name: Verify returned Evidence bundle
        id: verify
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          exact_go="$GO_TOOLCHAIN_WORK_DIR/go1.25.14-linux-amd64/go/bin/go"
          if [[ -x "$exact_go" ]]; then
            export PATH="$(dirname "$exact_go"):$PATH"
          fi

          sidecar="$WORK_DIR/$RUN_ID_PREFIX-evidence.sha256"
          report="$WORK_DIR/$RUN_ID_PREFIX-verification.json"
          if [[ ! -f "$sidecar" ]]; then
            echo "Evidence sidecar was not created" | tee -a "$WORK_DIR/runner-summary.txt"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          EXPECTED_SOURCE_GIT_SHA="$GITHUB_SHA" \
          EXPECTED_MODEL_SHA256="$MODEL_SHA256" \
          VERIFICATION_OUTPUT="$report" \
          bash evaluation/local-model-probe/verify_first_actual.sh "$sidecar"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "evidence_verification_exit_code=$rc" | tee -a "$WORK_DIR/runner-summary.txt"
          exit 0

      - name: Upload first actual Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacs-qwen35-08-first-actual-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/sei-local-model-first-actual/runner-summary.txt
            ${{ runner.temp }}/sei-local-model-first-actual/*-matrix.json
            ${{ runner.temp }}/sei-local-model-first-actual/*-llama-server.log
            ${{ runner.temp }}/sei-local-model-first-actual/*-evidence.sha256
            ${{ runner.temp }}/sei-local-model-first-actual/*-verification.json
            ${{ runner.temp }}/sei-local-model-first-actual/prototype-go125-test.log

      - name: Enforce actual-run gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual="${{ steps.actual.outputs.exit_code }}"
          regression="${{ steps.regression.outputs.exit_code }}"
          verify="${{ steps.verify.outputs.exit_code }}"
          echo "actual=$actual regression=$regression verify=$verify"
          if [[ "$actual" != "0" || "$regression" != "0" || "$verify" != "0" ]]; then
            exit 1
          fi
