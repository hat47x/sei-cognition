name: issue-500-runtime-guard

on:
  pull_request:
    branches:
      - develop/v0.2.0

permissions:
  contents: read

jobs:
  research-plan-runtime-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify exact Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          PLAN="evaluation/sparse-associative-cognition/research_plan.json"
          VALIDATOR="evaluation/sparse-associative-cognition/validate_research_plan.py"
          TESTS="evaluation/sparse-associative-cognition/test_validate_research_plan.py"

          test "$(git hash-object "$PLAN")" = "3131ba05742deb4d01655cd3a31119cc0c1432a1"
          test "$(git hash-object "$VALIDATOR")" = "4bdb1fc9664be7a211a17b842dd1218dedf20db7"
          test "$(git hash-object "$TESTS")" = "2fbdba0daa4a4fc08718ccd3bc868325c674f13c"

          echo "plan_blob=$(git hash-object "$PLAN")"
          echo "validator_blob=$(git hash-object "$VALIDATOR")"
          echo "tests_blob=$(git hash-object "$TESTS")"
          python --version
          uname -a

      - name: Run current research-plan validator
        run: python evaluation/sparse-associative-cognition/validate_research_plan.py

      - name: Run full research-plan unit suite
        run: python -m unittest -v evaluation/sparse-associative-cognition/test_validate_research_plan.py
