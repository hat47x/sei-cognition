name: issue-512-b6f-go125-runtime
# temporary evidence runner; removed before merge

on:
  pull_request:
    branches:
      - develop/v0.2.0

permissions:
  contents: read

jobs:
  b6f-go125-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Capture runtime identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)"
          go version
          uname -a
          cd evaluation/sparse-associative-cognition/prototype-go
          echo "go_mod_blob=$(git hash-object go.mod)"
          echo "b6f_test_blob=$(git hash-object suiassocprovider/residual_response_surface_test.go)"
          echo "provider_blob=$(git hash-object suiassocprovider/provider.go)"
          echo "capacity_profile_eval_blob=$(git hash-object suiassocprovider/capacity_profile_eval_test.go)"
          echo "capacityprofile_tree=$(git rev-parse HEAD:capacityprofile)"

      - name: Run focused SAC-B6f tests
        working-directory: evaluation/sparse-associative-cognition/prototype-go
        run: |
          go test -count=1 -v ./suiassocprovider -run 'TestResidualScaling(ResponseSurface|CannotUseSingleCardinalityRatioThreshold)$'

      - name: Run suiassocprovider regression
        working-directory: evaluation/sparse-associative-cognition/prototype-go
        run: go test -count=1 -v ./suiassocprovider

      - name: Run prototype-go full regression
        working-directory: evaluation/sparse-associative-cognition/prototype-go
        run: go test -count=1 ./...
