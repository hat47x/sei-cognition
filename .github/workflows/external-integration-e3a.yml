name: External Integration E3a

on:
  pull_request:
    paths:
      - "runtime/go/externalartifact/**"
      - "runtime/go/externalintegration/**"
      - "runtime/go/provideradapter/**"
      - "runtime/go/semanticruntime/**"
      - "runtime/go/go.mod"
      - "runtime/go/go.sum"
      - "fixtures/external/e3a/**"
      - ".github/workflows/external-integration-e3a.yml"
  push:
    branches:
      - develop/v0.2.0
    paths:
      - "runtime/go/externalartifact/**"
      - "runtime/go/externalintegration/**"
      - "runtime/go/provideradapter/**"
      - "runtime/go/semanticruntime/**"
      - "runtime/go/go.mod"
      - "runtime/go/go.sum"
      - "fixtures/external/e3a/**"
      - ".github/workflows/external-integration-e3a.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-artifact-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOZA
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: runtime/go/go.mod

      - name: Fetch version-pinned public Cognitive Method artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/soza-e3a"
          curl --fail --location --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/hat47x/cultural-substrate-weaving/aa3651f3460a6db7dc70bd848f93b600f149ffe8/plugins/cultural-substrate-weaving-ja/skills/weave/SKILL.md" \
            --output "${RUNNER_TEMP}/soza-e3a/cultural-substrate-weaving-SKILL.md"

      - name: Verify public artifact source identity and pinned snapshot
        shell: bash
        run: |
          set -euo pipefail
          actual_blob="$(git hash-object "${RUNNER_TEMP}/soza-e3a/cultural-substrate-weaving-SKILL.md")"
          test "${actual_blob}" = "4d1cd77a3561c4da58bc030936f28ae2386a81ce"
          cmp \
            "${RUNNER_TEMP}/soza-e3a/cultural-substrate-weaving-SKILL.md" \
            fixtures/external/e3a/cultural-substrate-weaving/SKILL.md.snapshot

      - name: Verify pinned TEI source snapshot identity
        shell: bash
        run: |
          set -euo pipefail
          actual_blob="$(git hash-object fixtures/external/e3a/tei/production.deployment-state.json)"
          test "${actual_blob}" = "ff3c60a8d9873f6aeb38549104ef6bb484404d17"

      - name: Test external artifact and semantic mapping boundaries
        working-directory: runtime/go
        run: go test ./externalartifact ./externalintegration
