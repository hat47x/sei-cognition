name: External Integration E3b

on:
  pull_request:
  push:
    branches:
      - develop/v0.2.0

permissions:
  contents: read

jobs:
  live-provider-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOZA
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: runtime/go/go.mod

      - name: Test deterministic live integration boundaries
        working-directory: runtime/go
        run: go test ./liveintegration

      - name: Call public live Provider service and validate mapping
        working-directory: runtime/go
        env:
          SOZA_E3B_LIVE: "1"
          SOZA_LIVE_PROVIDER_TOKEN: ${{ github.token }}
        run: go test ./liveintegration -run '^TestLiveGitHubCommitService$' -count=1 -v
