name: ISSUE-000065 CI finalization

on:
  push:
    branches:
      - work/close-actual-tei-e3b-p2-v0.2.0
    paths:
      - ".github/workflows/issue-000065-ci-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/close-actual-tei-e3b-p2-v0.2.0

      - name: ISSUE-000065へ最終CI Evidenceを反映
        run: python3 .github/scripts/finalize_issue_000065_ci.py

      - name: 一時同期ファイルを削除してcommit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/finalize_issue_000065_ci.py
          rm .github/workflows/issue-000065-ci-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "plan: record ISSUE-000065 final CI evidence"
          git push origin HEAD:work/close-actual-tei-e3b-p2-v0.2.0
