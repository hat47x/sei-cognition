name: External Method Integration E3b

on:
  pull_request:
    paths:
      - "runtime/go/livemethodintegration/**"
      - "!runtime/go/livemethodintegration/model_artifact_exchange_test.go"
      - "!runtime/go/livemethodintegration/runtime_version_exchange_test.go"
      - "runtime/go/interactionprobe/**"
      - "runtime/go/semanticruntime/**"
      - "runtime/go/go.mod"
      - "runtime/go/go.sum"
      - ".github/workflows/external-method-integration-e3b.yml"
  push:
    branches:
      - develop/v0.2.0
    paths:
      - "runtime/go/livemethodintegration/**"
      - "!runtime/go/livemethodintegration/model_artifact_exchange_test.go"
      - "!runtime/go/livemethodintegration/runtime_version_exchange_test.go"
      - "runtime/go/interactionprobe/**"
      - "runtime/go/semanticruntime/**"
      - "runtime/go/go.mod"
      - "runtime/go/go.sum"
      - ".github/workflows/external-method-integration-e3b.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-cognitive-method-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOZA
        uses: actions/checkout@v4

      - name: Checkout pinned KJ Atlas
        uses: actions/checkout@v4
        with:
          repository: hat47x/kj-atlas
          ref: 4f28c13abe4176503c6fed863383a2d1db2299e9
          path: _external/kj-atlas
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: runtime/go/go.mod

      - name: Install pinned KJ Atlas backend
        run: python -m pip install -e "_external/kj-atlas/03_Implement/backend"

      - name: Prepare KJ Atlas SQLite schema
        working-directory: _external/kj-atlas/03_Implement/backend
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:////tmp/kj-atlas-e3b-m1.db
        run: alembic upgrade head

      - name: Start KJ Atlas mock model and backend processes
        shell: bash
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:////tmp/kj-atlas-e3b-m1.db
          KJ_ATLAS_RUNTIME_PROFILE: local-dev
          KJ_ATLAS_LLM_PROVIDER: local
          KJ_ATLAS_LOCAL_LLM_BASE_URL: http://127.0.0.1:8001
          KJ_ATLAS_LOCAL_LLM_MODEL: mock
          KJ_ATLAS_LLM_FALLBACK_TO_NONE: "false"
        run: |
          set -euo pipefail
          python _external/kj-atlas/03_Implement/deploy/tools/mock_local_llm.py \
            --host 127.0.0.1 --port 8001 >/tmp/kj-atlas-mock.log 2>&1 &
          echo $! >/tmp/kj-atlas-mock.pid

          PYTHONPATH=_external/kj-atlas/03_Implement/backend/src \
            uvicorn kj_atlas_api.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/kj-atlas-backend.log 2>&1 &
          echo $! >/tmp/kj-atlas-backend.pid

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          echo "KJ Atlas processes did not become ready" >&2
          cat /tmp/kj-atlas-mock.log >&2 || true
          cat /tmp/kj-atlas-backend.log >&2 || true
          exit 1

      - name: Execute live KJ Atlas grouping method
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/kj-atlas-request.json <<'JSON'
          {
            "cards": [
              {"id":"c-remote","text":"在宅勤務でも成果を出せると考えている","textReviewed":true},
              {"id":"c-office","text":"対面でないと設計の議論が浅くなると感じている","textReviewed":true},
              {"id":"c-held","text":"評価制度の見直しはまだ着手していない","textReviewed":true}
            ],
            "doc": {
              "version": 1,
              "id": "soza-e3b-m1",
              "createdAt": "2026-09-02T00:00:00Z",
              "updatedAt": "2026-09-02T00:00:00Z",
              "transform": {"panX":0,"panY":0,"zoom":1},
              "cards": [
                {"id":"c-remote","text":"在宅勤務でも成果を出せると考えている","x":0,"y":0,"textReviewed":true},
                {"id":"c-office","text":"対面でないと設計の議論が浅くなると感じている","x":40,"y":0,"textReviewed":true},
                {"id":"c-held","text":"評価制度の見直しはまだ着手していない","x":80,"y":0,"textReviewed":true,"holdState":"held"}
              ],
              "edges": [],
              "islands": [],
              "evidenceLinks": []
            }
          }
          JSON

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @/tmp/kj-atlas-request.json \
            http://127.0.0.1:8000/ai/suggest-card-groups \
            >/tmp/kj-atlas-result.json

          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/kj-atlas-result.json').read_text(encoding='utf-8'))
          assert isinstance(result.get('groups'), list) and result['groups'], result
          assert result.get('excludedCardIds') == ['c-held'], result
          assert result.get('truncated') is False, result
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Test SOZA method mapping boundaries
        working-directory: runtime/go
        run: go test ./livemethodintegration

      - name: Map actual external method result into SOZA semantic records
        working-directory: runtime/go
        env:
          SOZA_E3B_METHOD_LIVE: "1"
          SOZA_E3B_METHOD_RESULT: /tmp/kj-atlas-result.json
          SOZA_E3B_METHOD_SOURCE_COMMIT: 4f28c13abe4176503c6fed863383a2d1db2299e9
          SOZA_E3B_METHOD_REALIZATION_ID: MR-KJ-ATLAS-M1A
          SOZA_E3B_METHOD_EXECUTION_PROFILE: kj-atlas-deterministic-model-stub
          SOZA_E3B_METHOD_MODEL: mock
        run: go test ./livemethodintegration -run '^TestLiveKJAtlasMethodExecution$' -count=1 -v

      - name: Show external process logs on failure
        if: failure()
        run: |
          cat /tmp/kj-atlas-result.json || true
          cat /tmp/kj-atlas-mock.log || true
          cat /tmp/kj-atlas-backend.log || true

      - name: Stop external processes
        if: always()
        run: |
          if test -f /tmp/kj-atlas-backend.pid; then kill "$(cat /tmp/kj-atlas-backend.pid)" 2>/dev/null || true; fi
          if test -f /tmp/kj-atlas-mock.pid; then kill "$(cat /tmp/kj-atlas-mock.pid)" 2>/dev/null || true; fi
