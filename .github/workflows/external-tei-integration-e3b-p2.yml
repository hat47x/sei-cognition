name: External TEI Integration E3b P2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-tei-provider-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOZA
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: runtime/go/go.mod

      - name: Test deterministic TEI process boundary
        working-directory: runtime/go
        run: go test ./teiintegration -count=1

      - name: Check whether the private TEI repository can be acquired
        id: credential
        shell: bash
        env:
          TEI_REPOSITORY_TOKEN: ${{ secrets.TEI_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${TEI_REPOSITORY_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "A repository-scoped credential is available. The actual TEI probe will run."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::TEI_REPOSITORY_TOKEN is not configured. Deterministic boundary tests passed, but E3b-P2 remains Not Yet Verified."
          fi

      - name: Checkout the pinned TEI revision
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: hat47x/tei-platform
          ref: 48a7ca1fe8a9538e9e9be3e1ee08ef14804c8f67
          token: ${{ secrets.TEI_REPOSITORY_TOKEN }}
          path: external/tei-platform

      - name: Build the actual TEI CLI
        if: steps.credential.outputs.available == 'true'
        working-directory: external/tei-platform
        run: go build -o /tmp/tei ./cmd/tei

      - name: Verify the pinned TEI Reference Workspace
        if: steps.credential.outputs.available == 'true'
        working-directory: external/tei-platform
        run: /tmp/tei validate -workspace reference/workspace

      - name: Execute the actual TEI Provider Plan through the SOZA adapter
        if: steps.credential.outputs.available == 'true'
        working-directory: runtime/go
        env:
          SOZA_E3B_TEI_LIVE: "1"
          SOZA_TEI_EXECUTABLE: /tmp/tei
          SOZA_TEI_WORKSPACE: ${{ github.workspace }}/external/tei-platform/reference/workspace
          SOZA_TEI_RUN: ${{ github.workspace }}/external/tei-platform/reference/order_rollout.durable-run.m0.21.start.json
          SOZA_TEI_PLUGIN_LOCK: ${{ github.workspace }}/external/tei-platform/reference/workspace/.tei/plugin-lock.json
          SOZA_TEI_SOURCE_STATE_REF: github:hat47x/tei-platform@48a7ca1fe8a9538e9e9be3e1ee08ef14804c8f67
        run: go test ./teiintegration -run '^TestLiveTEIProviderPlan$' -count=1 -v

      - name: Record the evidence boundary when acquisition is unavailable
        if: steps.credential.outputs.available != 'true'
        shell: bash
        run: |
          cat <<'EOF'
          The actual TEI executable was not acquired in this run.
          This run verifies only the deterministic external-process boundary.
          It must not be cited as E3b-P2 Scoped Executable Evidence.
          EOF
