name: SAC B3 Go evaluation

on:
  pull_request:
    paths:
      - "evaluation/sparse-associative-cognition/prototype-go/**"
      - ".github/workflows/sac-b3-go-eval.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation/sparse-associative-cognition/prototype-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test prototype
        run: go test ./...
      - name: Benchmark B3 prepared features
        run: go test ./suiassocprovider -run '^$' -bench '^BenchmarkProjectionBiasPreparedFeatures$' -benchmem -count=3
